[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "avocado_ai"
version = "0.0.1"
description = "Monitoring Water Stress in Avocado Orchards Using Multitemporal Satellite Imagery and AI-Based Analysis"
authors = [
  { name = "Jaime Mendivil, Jesus Lopez, Omar Hernandez" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = "~=3.10.0"


[tool.ruff]
line-length = 99
src = ["avocado_ai"]
include = ["pyproject.toml", "avocado_ai/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["avocado_ai"]
force-sort-within-sections = true

